version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: naver-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naver_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-naver_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - naver-monitor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naver_monitor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.light  # 경량 이미지 (시스템 chromium 사용)
    container_name: naver-monitor-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-naver_monitor}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-naver_monitor}
      
      # JWT
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      
      # CORS
      PUBLIC_IP: ${PUBLIC_IP:-localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      
      # Aligo SMS (선택사항)
      ALIGO_API_KEY: ${ALIGO_API_KEY:-}
      ALIGO_USER_ID: ${ALIGO_USER_ID:-}
      ALIGO_SENDER: ${ALIGO_SENDER:-}
      
      # OpenAI (선택사항)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./logs:/app/logs
      - playwright_cache:/root/.cache/ms-playwright
    depends_on:
      db:
        condition: service_healthy
    networks:
      - naver-monitor-network
    command: python3 server-debug.py

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: http://${PUBLIC_IP:-localhost}:${BACKEND_PORT:-8001}
    container_name: naver-monitor-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - naver-monitor-network

volumes:
  postgres_data:
  playwright_cache:

networks:
  naver-monitor-network:
    driver: bridge
